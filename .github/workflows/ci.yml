name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-that-is-not-used-in-production
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      EMAIL_DELIVERY: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prettier:check
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm audit --audit-level=high
      - run: npm run build
