name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  APP_URL: https://field-atlas.example.test
  AUTH_SECRET: ci-only-auth-secret-that-is-not-used-in-production
  AUTH_HMAC_SECRET: ci-only-hmac-secret-that-is-not-used-in-production
  MEDIA_GRANT_SECRET: ci-only-media-secret-that-is-not-used-in-production
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  EMAIL_DELIVERY: console

jobs:
  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prettier:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build without runtime database credentials
        run: npm run build
        env:
          DATABASE_URL: ''
          POSTGRES_URL: ''

  database-integration:
    name: PostgreSQL migrations and authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: field_atlas_ci
          POSTGRES_PASSWORD: migration-owner-password
          POSTGRES_USER: migration_owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=migration_owner --dbname=field_atlas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://field_atlas_runtime:runtime-only-ci-password@127.0.0.1:5432/field_atlas_ci
      POSTGRES_URL: postgresql://field_atlas_runtime:runtime-only-ci-password@127.0.0.1:5432/field_atlas_ci
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration-owner-password@127.0.0.1:5432/field_atlas_ci
      FIELD_ATLAS_RUNTIME_DATABASE_PASSWORD: runtime-only-ci-password
      AUTH_INTEGRATION_TESTS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the pre-migration application schema
        run: psql "$MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=test/integration/bootstrap.sql
      - name: Apply migrations with the production runner
        run: npm run migrate
      - name: Re-run the production migration runner to prove idempotency
        run: npm run migrate
      - name: Verify changed migrations are rejected
        shell: bash
        run: |
          migration_file='migrations/001_password_reset.sql'
          migration_backup="$(mktemp)"
          migration_output="$(mktemp)"

          cleanup() {
            cp "$migration_backup" "$migration_file"
            rm -f "$migration_backup" "$migration_output"
          }
          trap cleanup EXIT

          cp "$migration_file" "$migration_backup"
          printf '\n-- CI checksum drift probe\n' >> "$migration_file"

          if npm run migrate >"$migration_output" 2>&1; then
            cat "$migration_output"
            echo 'Migration runner accepted an altered applied migration.' >&2
            exit 1
          fi

          cat "$migration_output"
          if ! grep -Fq 'was changed after it was applied' "$migration_output"; then
            echo 'Migration runner failed for an unexpected reason.' >&2
            exit 1
          fi
      - name: Verify authentication database policy
        run: psql "$MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=test/integration/auth-database.sql
      - name: Provision a least-privilege runtime role
        run: >-
          psql "$MIGRATION_DATABASE_URL"
          --set=ON_ERROR_STOP=1
          --set=runtime_role=field_atlas_runtime
          --file=scripts/provision-runtime-database-role.sql
      - name: Exercise production authentication flows against PostgreSQL
        run: npm run test:integration:auth
      - name: Verify runtime data access
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command='SELECT COUNT(*) FROM users;'
      - name: Verify runtime DDL is denied
        run: |
          if psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command='CREATE TABLE forbidden_runtime_ddl (id INTEGER);'; then
            echo 'Runtime role unexpectedly has schema CREATE permission.' >&2
            exit 1
          fi
          if psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command='TRUNCATE TABLE users;'; then
            echo 'Runtime role unexpectedly has TRUNCATE permission.' >&2
            exit 1
          fi

  authenticated-ui-audit:
    name: Authenticated browser UI audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: field_atlas_e2e
          POSTGRES_PASSWORD: migration-owner-password
          POSTGRES_USER: migration_owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=migration_owner --dbname=field_atlas_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_URL: http://127.0.0.1:3100
      AUTH_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://field_atlas_runtime:runtime-only-e2e-password-2026-safe@127.0.0.1:5432/field_atlas_e2e
      E2E_CHAPTER_ID: 6a67afcf-768f-4fe4-8c62-41b58a19840d
      E2E_ENTRY_ID: 0a934c64-997f-43c2-88a3-8b102d517781
      E2E_TEST_EMAIL: field-atlas-e2e@example.test
      E2E_TEST_PASSWORD: field-atlas-e2e-password-2026
      PASSKEY_ORIGIN: http://127.0.0.1:3100
      PASSKEY_RP_ID: 127.0.0.1
      POSTGRES_URL: postgresql://field_atlas_runtime:runtime-only-e2e-password-2026-safe@127.0.0.1:5432/field_atlas_e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the pre-migration application schema
        run: psql "$MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=test/integration/bootstrap.sql
        env:
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration-owner-password@127.0.0.1:5432/field_atlas_e2e
      - name: Apply migrations with the production runner
        run: npm run migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration-owner-password@127.0.0.1:5432/field_atlas_e2e
      - name: Provision a least-privilege runtime role
        run: >-
          psql "$MIGRATION_DATABASE_URL"
          --set=ON_ERROR_STOP=1
          --set=runtime_role=field_atlas_runtime
          --file=scripts/provision-runtime-database-role.sql
        env:
          FIELD_ATLAS_RUNTIME_DATABASE_PASSWORD: runtime-only-e2e-password-2026-safe
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration-owner-password@127.0.0.1:5432/field_atlas_e2e
      - name: Seed the isolated browser-test account and atlas
        run: npm run seed:e2e
        env:
          E2E_DATABASE_SEED: '1'
          E2E_DATABASE_URL: postgresql://migration_owner:migration-owner-password@127.0.0.1:5432/field_atlas_e2e
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Audit authenticated desktop and mobile flows
        run: >-
          npm run test:e2e:authenticated --
          --project=chromium
          --project=mobile-chromium
          --project=mobile-chromium-landscape
      - name: Upload browser audit artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authenticated-ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ui-audit/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
